<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lem-in</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #11151f;
    --line: #1e2534;
    --fg: #e6ecf7;
    --dim: #79859e;
    --accent: #5ab0ff;
    --ok: #34e08a;
    --bad: #ff5f6d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
  }
  header .sub { color: var(--dim); font-size: 11px; letter-spacing: .06em; }
  header .spacer { flex: 1; }
  header .turn { color: var(--dim); font-size: 12px; }
  header .turn b {
    color: var(--fg);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.02em;
  }

  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }

  aside {
    width: 282px;
    flex: 0 0 282px;
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 18px;
    overflow-y: auto;
  }
  aside h2 {
    margin: 24px 0 10px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--dim);
  }
  aside h2:first-child { margin-top: 0; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 10px; }
  .stat .n {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.1;
  }
  .stat .l {
    font-size: 10px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .n.good { color: var(--ok); }
  .n.bad { color: var(--bad); }

  .bar {
    height: 7px;
    border-radius: 4px;
    background: #171e2b;
    overflow: hidden;
    display: flex;
    margin: 2px 0 9px;
  }
  .bar i { display: block; height: 100%; transition: width .1s linear; }
  .b-end { background: var(--ok); }
  .b-transit { background: var(--accent); }
  .b-start { background: #38445c; }
  .legend { display: flex; justify-content: space-between; font-size: 11px; }
  .legend span { color: var(--dim); }
  .legend b { color: var(--fg); font-weight: 700; }

  .routes { display: flex; flex-direction: column; gap: 5px; }
  .route { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .route .sw { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
  .route .len { margin-left: auto; color: var(--dim); }

  .check { display: flex; gap: 8px; padding: 2px 0; align-items: flex-start; }
  .check .m { font-weight: 700; flex: 0 0 auto; }
  .check.pass .m { color: var(--ok); }
  .check.fail .m { color: var(--bad); }
  .check .t { color: var(--dim); }
  .check.fail .t { color: var(--bad); }
  .verdict {
    margin-top: 12px;
    padding: 10px;
    border-radius: 7px;
    text-align: center;
    font-weight: 700;
    letter-spacing: .12em;
    font-size: 12px;
  }
  .verdict.pass {
    background: rgba(52,224,138,.12);
    color: var(--ok);
    border: 1px solid rgba(52,224,138,.3);
  }
  .verdict.fail {
    background: rgba(255,95,109,.12);
    color: var(--bad);
    border: 1px solid rgba(255,95,109,.3);
  }

  footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 18px;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  button, select {
    background: #1a2130;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 13px;
    font: inherit;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #061019;
    font-weight: 700;
    min-width: 76px;
  }
  #scrub { flex: 1; accent-color: var(--accent); cursor: pointer; }

  #empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--dim);
    text-align: center;
    padding: 24px;
  }
  #empty.hidden { display: none; }
  #empty code {
    color: var(--accent);
    background: #141b28;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 11px 16px;
    font-size: 14px;
  }
  #empty .err { color: var(--bad); }
</style>
</head>
<body>

<header>
  <h1>lem-in</h1>
  <span class="sub">Ant farm</span>
  <span class="spacer"></span>
  <span class="turn">Turn <b id="s-turn">0</b> / <span id="s-total">0</span></span>
</header>

<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="empty">
      <p>Feed a simulation in:</p>
      <code>./lem-in &lt; map | ./visu</code>
      <p>Then open the <b>lem-in-visu.html</b> it writes.</p>
      <p class="err" id="err"></p>
    </div>
  </div>

  <aside>
    <h2>Colony</h2>
    <div class="stats">
      <div class="stat"><div class="n" id="s-ants">-</div><div class="l">Ants</div></div>
      <div class="stat"><div class="n" id="s-rooms">-</div><div class="l">Rooms</div></div>
      <div class="stat"><div class="n" id="s-links">-</div><div class="l">Tunnels</div></div>
      <div class="stat"><div class="n" id="s-routes">-</div><div class="l">Routes used</div></div>
    </div>

    <h2>Progress</h2>
    <div class="bar">
      <i class="b-end" id="p-end"></i>
      <i class="b-transit" id="p-transit"></i>
      <i class="b-start" id="p-start"></i>
    </div>
    <div class="legend">
      <span>Start <b id="s-atstart">-</b></span>
      <span>Moving <b id="s-transit">-</b></span>
      <span>Arrived <b id="s-arrived">-</b></span>
    </div>

    <h2>Routes</h2>
    <div class="routes" id="s-routelist"></div>

    <h2>Validity</h2>
    <div id="s-checks"></div>
    <div class="verdict" id="s-verdict">-</div>
  </aside>
</main>

<footer>
  <button id="play" class="primary">Play</button>
  <button id="back">&#9664;</button>
  <button id="fwd">&#9654;</button>
  <input type="range" id="scrub" min="0" max="0" value="0" step="0.001">
  <button id="center">Center</button>
  <select id="speed">
    <option value="1" selected>1x</option>
    <option value="2">2x</option>
    <option value="4">4x</option>
    <option value="8">8x</option>
    <option value="16">16x</option>
  </select>
</footer>

<script>
"use strict";

/* ---------------------------------------------------------------- parsing */

/* lem-in prints the echoed colony, a blank line, then one line per turn. */
function parseOutput(text) {
  const lines = text.split("\n");
  const rooms = new Map();
  const links = [];
  const turns = [];
  const opts = {};
  let ants = null, start = null, end = null, pending = null;

  for (const raw of lines) {
    const line = raw.replace(/\r$/, "");
    if (/^L\d+-\S/.test(line)) {
      const moves = [];
      for (const tok of line.trim().split(/\s+/)) {
        const m = /^L(\d+)-(\S+)$/.exec(tok);
        if (!m) throw new Error('Malformed move token "' + tok + '"');
        moves.push({ ant: +m[1], room: m[2] });
      }
      turns.push(moves);
      continue;
    }
    if (turns.length || !line.trim()) continue;
    if (line === "##start") { pending = "start"; continue; }
    if (line === "##end") { pending = "end"; continue; }
    if (line[0] === "#") {
      const cmd = /^##visu\s+(.+)$/.exec(line);
      if (cmd) for (const t of cmd[1].trim().split(/\s+/)) {
        const kv = t.split("=");
        opts[kv[0]] = kv[1] === undefined ? true : kv[1];
      }
      continue;
    }
    if (ants === null && /^\d+$/.test(line)) { ants = +line; continue; }
    const room = /^(\S+)\s+(-?\d+)\s+(-?\d+)$/.exec(line);
    if (room) {
      rooms.set(room[1], { x: +room[2], y: +room[3] });
      if (pending === "start") start = room[1];
      if (pending === "end") end = room[1];
      pending = null;
      continue;
    }
    const link = /^([^\s-]+)-([^\s-]+)$/.exec(line);
    if (link && rooms.has(link[1]) && rooms.has(link[2])) links.push(link.slice(1));
  }

  if (ants === null) throw new Error("No ant count found");
  if (!start || !end) throw new Error("No ##start / ##end found");
  if (!turns.length) throw new Error("No movement lines found");

  const adj = new Map();
  for (const n of rooms.keys()) adj.set(n, new Set());
  for (const l of links) { adj.get(l[0]).add(l[1]); adj.get(l[1]).add(l[0]); }
  return { ants, rooms, links, adj, start, end, turns, opts };
}

/* --------------------------------------------------------------- tracking */

/* Where every ant stands after each turn, and the route each one walked. */
function buildTrace(f) {
  const pos = [new Map()];
  const walk = new Map();
  for (let a = 1; a <= f.ants; a++) { pos[0].set(a, f.start); walk.set(a, [f.start]); }

  for (const moves of f.turns) {
    const next = new Map(pos[pos.length - 1]);
    for (const mv of moves) {
      next.set(mv.ant, mv.room);
      if (walk.has(mv.ant)) walk.get(mv.ant).push(mv.room);
    }
    pos.push(next);
  }

  const routes = [];
  const seen = new Map();
  for (let a = 1; a <= f.ants; a++) {
    const key = walk.get(a).join(" ");
    if (!seen.has(key)) {
      seen.set(key, routes.length);
      routes.push({ rooms: walk.get(a), ants: [], len: walk.get(a).length - 1 });
    }
    routes[seen.get(key)].ants.push(a);
  }
  routes.sort((p, q) => p.len - q.len);
  const antRoute = new Map();
  routes.forEach((r, i) => r.ants.forEach(a => antRoute.set(a, i)));
  return { pos, routes, antRoute };
}

/* ------------------------------------------------------------- validation */

/* Re-checks the simulation against the colony, independently of lem-in. */
function validate(f) {
  const checks = [
    { t: "One move per ant each turn", bad: 0 },
    { t: "Every move crosses a tunnel", bad: 0 },
    { t: "The room entered was free", bad: 0 },
    { t: "Ant numbers within range", bad: 0 },
    { t: "Every ant reaches ##end", bad: 0 },
  ];
  const detail = [];
  const busy = new Map();
  const at = new Map();
  for (let a = 1; a <= f.ants; a++) at.set(a, f.start);

  f.turns.forEach((moves, i) => {
    const t = i + 1;
    const moved = new Set();
    for (const mv of moves) {
      if (moved.has(mv.ant)) {
        checks[0].bad++;
        detail.push("Turn " + t + ": L" + mv.ant + " moves twice");
      }
      moved.add(mv.ant);
      if (mv.ant < 1 || mv.ant > f.ants) {
        checks[3].bad++;
        detail.push("Turn " + t + ": ant " + mv.ant + " is out of range");
        continue;
      }
      const from = at.get(mv.ant);
      if (!f.rooms.has(mv.room) || !f.adj.get(from) || !f.adj.get(from).has(mv.room)) {
        checks[1].bad++;
        detail.push("Turn " + t + ": L" + mv.ant + "-" + mv.room +
                    " is not next to " + from);
      }
    }
    for (const mv of moves) {
      const from = at.get(mv.ant);
      if (from !== f.start && from !== f.end) busy.delete(from);
    }
    for (const mv of moves) {
      if (mv.room !== f.start && mv.room !== f.end) {
        if (busy.has(mv.room)) {
          checks[2].bad++;
          detail.push("Turn " + t + ": " + mv.room + " already holds L" +
                      busy.get(mv.room));
        }
        busy.set(mv.room, mv.ant);
      }
      at.set(mv.ant, mv.room);
    }
  });

  for (let a = 1; a <= f.ants; a++) if (at.get(a) !== f.end) checks[4].bad++;
  return { checks, detail, ok: checks.every(c => c.bad === 0) };
}

/* ----------------------------------------------------------------- layout */

/* One lane per route: start on the left, end on the right, a dot per room.
   The generator puts every room on the x == y diagonal, so the map's own
   coordinates carry no shape - the routes are what the solution is about. */
function layoutRoutes(f, trace) {
  const place = new Map();
  const maxLen = Math.max(1, ...trace.routes.map(r => r.len));
  const span = Math.max(maxLen, 5) * 46;
  const n = trace.routes.length;
  const gap = Math.max(10, Math.min(span / 3, span / (n + 1)));

  trace.routes.forEach((r, i) => {
    const y = (i - (n - 1) / 2) * gap;
    r.rooms.forEach((name, k) => {
      if (name === f.start || name === f.end) return;
      place.set(name, { x: (k / r.len) * span, y: y });
    });
  });
  place.set(f.start, { x: 0, y: 0 });
  place.set(f.end, { x: span, y: 0 });
  geom = { span: span, maxLen: maxLen };
  return place;
}

/* ------------------------------------------------------------------- view */

const PALETTE = ["#5ab0ff", "#ffb454", "#c58cff", "#34e08a", "#ff8fa3", "#5ce1e6",
                 "#ffd166", "#a5d94f", "#ff9f6e", "#8aa9ff", "#f78fb3", "#6fe0b4"];

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let farm = null, trace = null, report = null, place = null;
let cam = { x: 0, y: 0, k: 1 };
let geom = { span: 1, maxLen: 1 };
let time = 0, playing = false, speed = 1, last = 0;

function $(id) { return document.getElementById(id); }

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.floor(cv.clientWidth * dpr));
  cv.height = Math.max(1, Math.floor(cv.clientHeight * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", function () { resize(); center(); });

function center() {
  if (!place || !place.size) return;
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  for (const p of place.values()) {
    a = Math.min(a, p.x); b = Math.max(b, p.x);
    c = Math.min(c, p.y); d = Math.max(d, p.y);
  }
  const pad = 60;
  cam.k = Math.min((cv.clientWidth - pad * 2) / Math.max(1, b - a),
                   (cv.clientHeight - pad * 2) / Math.max(1, d - c));
  if (!isFinite(cam.k) || cam.k <= 0) cam.k = 1;
  cam.k = Math.min(cam.k, 34);
  cam.x = cv.clientWidth / 2 - ((a + b) / 2) * cam.k;
  cam.y = cv.clientHeight / 2 - ((c + d) / 2) * cam.k;
  draw();
}

function step() { return (geom.span / geom.maxLen) * cam.k; }

function sx(p) { return p.x * cam.k + cam.x; }
function sy(p) { return p.y * cam.k + cam.y; }

/* Ants glide between the two turns they sit between. */
function antsAt(t) {
  const i = Math.min(Math.floor(t), trace.pos.length - 1);
  const j = Math.min(i + 1, trace.pos.length - 1);
  const f = t - i;
  const out = [];
  for (let a = 1; a <= farm.ants; a++) {
    const r0 = trace.pos[i].get(a);
    const r1 = trace.pos[j].get(a);
    if (r0 === r1 && (r0 === farm.start || r0 === farm.end)) continue;
    const p0 = place.get(r0);
    const p1 = place.get(r1);
    if (!p0 || !p1) continue;
    out.push({ id: a, x: p0.x + (p1.x - p0.x) * f, y: p0.y + (p1.y - p0.y) * f });
  }
  return out;
}

function drawRoutes() {
  const d = step();
  const rad = Math.max(1.2, Math.min(6, d * 0.1));
  trace.routes.forEach(function (r, i) {
    const col = PALETTE[i % PALETTE.length];
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1.2, Math.min(3.5, d * 0.05));
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    for (let k = 0; k < r.rooms.length; k++) {
      const p = place.get(r.rooms[k]);
      if (!p) continue;
      if (k === 0) ctx.moveTo(sx(p), sy(p));
      else ctx.lineTo(sx(p), sy(p));
    }
    ctx.stroke();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = col;
    ctx.beginPath();
    for (const name of r.rooms) {
      if (name === farm.start || name === farm.end) continue;
      const p = place.get(name);
      ctx.moveTo(sx(p) + rad, sy(p));
      ctx.arc(sx(p), sy(p), rad, 0, Math.PI * 2);
    }
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/* Drawn last so no ant ever covers the two rooms that matter. */
function drawEnds() {
  const r = Math.max(9, Math.min(24, step() * 0.46));
  const ends = [[farm.start, "#34e08a"], [farm.end, "#ff5f6d"]];
  for (const e of ends) {
    const p = place.get(e[0]);
    if (!p) continue;
    ctx.fillStyle = e[1];
    ctx.shadowColor = e[1];
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(sx(p), sy(p), r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#e6ecf7";
    ctx.font = "bold 12px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.fillText(e[0], sx(p), sy(p) - r - 10);
  }
}

function drawAnts() {
  const ants = antsAt(time);
  const r = Math.max(3, Math.min(17, step() * 0.33));
  const glow = ants.length <= 260;
  ctx.lineWidth = Math.max(1, r * 0.22);
  ctx.strokeStyle = "#0b0e14";
  for (const a of ants) {
    const x = sx(a), y = sy(a);
    if (x < -30 || y < -30 || x > cv.clientWidth + 30 || y > cv.clientHeight + 30)
      continue;
    const col = PALETTE[(trace.antRoute.get(a.id) || 0) % PALETTE.length];
    ctx.fillStyle = col;
    if (glow) { ctx.shadowColor = col; ctx.shadowBlur = 14; }
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();
  }
  ctx.font = "bold 100px ui-monospace, monospace";
  const fs = Math.min(Math.round(r * 0.95),
    Math.floor(r * 150 / ctx.measureText(String(farm.ants)).width));
  if (fs >= 6)
  {
    ctx.fillStyle = "#0b0e14";
    ctx.font = "bold " + fs + "px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const a of ants) ctx.fillText(String(a.id), sx(a), sy(a));
    ctx.textBaseline = "alphabetic";
  }
}

function draw() {
  ctx.fillStyle = "#0b0e14";
  ctx.fillRect(0, 0, cv.clientWidth, cv.clientHeight);
  if (!farm) return;
  drawRoutes();
  drawAnts();
  drawEnds();
  updateLive();
}

/* ------------------------------------------------------------------ panel */

function updateLive() {
  const snap = trace.pos[Math.min(Math.round(time), trace.pos.length - 1)];
  let atStart = 0, arrived = 0, moving = 0;
  for (let a = 1; a <= farm.ants; a++) {
    const r = snap.get(a);
    if (r === farm.start) atStart++;
    else if (r === farm.end) arrived++;
    else moving++;
  }
  $("s-atstart").textContent = atStart;
  $("s-transit").textContent = moving;
  $("s-arrived").textContent = arrived;
  $("s-turn").textContent = Math.min(Math.round(time), farm.turns.length);
  $("p-end").style.width = (arrived / farm.ants * 100) + "%";
  $("p-transit").style.width = (moving / farm.ants * 100) + "%";
  $("p-start").style.width = (atStart / farm.ants * 100) + "%";
}

function fillPanel() {
  $("s-ants").textContent = farm.ants;
  $("s-rooms").textContent = farm.rooms.size;
  $("s-links").textContent = farm.links.length;
  $("s-routes").textContent = trace.routes.length;
  $("s-total").textContent = farm.turns.length;

  const rl = $("s-routelist");
  rl.innerHTML = "";
  trace.routes.forEach(function (r, i) {
    const el = document.createElement("div");
    el.className = "route";
    el.innerHTML = '<span class="sw" style="background:' + PALETTE[i % PALETTE.length] +
                   '"></span><span>' + r.ants.length + " ant" +
                   (r.ants.length > 1 ? "s" : "") + '</span><span class="len">' +
                   r.len + " rooms</span>";
    rl.appendChild(el);
  });

  const cb = $("s-checks");
  cb.innerHTML = "";
  for (const c of report.checks) {
    const el = document.createElement("div");
    el.className = "check " + (c.bad ? "fail" : "pass");
    el.innerHTML = '<span class="m">' + (c.bad ? "✗" : "✓") +
                   '</span><span class="t">' + c.t +
                   (c.bad ? " &mdash; " + c.bad + "×" : "") + "</span>";
    cb.appendChild(el);
  }
  if (report.detail.length) {
    const el = document.createElement("div");
    el.className = "check fail";
    el.innerHTML = '<span class="m">!</span><span class="t">' + report.detail[0] + "</span>";
    cb.appendChild(el);
  }
  const v = $("s-verdict");
  v.className = "verdict " + (report.ok ? "pass" : "fail");
  v.textContent = report.ok ? "VALID SOLUTION" : "INVALID SOLUTION";
}

/* --------------------------------------------------------------- playback */

function setTime(t) {
  time = Math.max(0, Math.min(farm.turns.length, t));
  $("scrub").value = time;
  draw();
}

function setPlaying(on) {
  playing = on;
  $("play").textContent = on ? "Pause"
    : (farm && time >= farm.turns.length ? "Replay" : "Play");
}

requestAnimationFrame(function tick(now) {
  requestAnimationFrame(tick);
  const dt = (now - last) / 1000;
  last = now;
  if (!playing || !farm || dt > 1) return;
  setTime(time + dt * speed);
  if (time >= farm.turns.length) setPlaying(false);
});

/* ------------------------------------------------------------------- load */

/* Called by ./visu, which injects the simulation into a copy of this page. */
function load(text) {
  try {
    farm = parseOutput(text);
    trace = buildTrace(farm);
    report = validate(farm);
    place = layoutRoutes(farm, trace);
  } catch (e) {
    farm = null;
    $("err").textContent = e.message;
    return;
  }
  $("empty").classList.add("hidden");
  $("scrub").max = farm.turns.length;
  fillPanel();
  resize();
  center();
  setTime(0);
  if (farm.opts.speed &&
      [].slice.call($("speed").options).some(function (o) {
        return o.value === farm.opts.speed;
      })) {
    $("speed").value = farm.opts.speed;
    speed = +farm.opts.speed;
  }
  setPlaying(!farm.opts.paused);
}
window.load = load;

$("play").onclick = function () {
  if (!farm) return;
  if (time >= farm.turns.length) setTime(0);
  setPlaying(!playing);
};
$("fwd").onclick = function () { setPlaying(false); setTime(Math.floor(time) + 1); };
$("back").onclick = function () { setPlaying(false); setTime(Math.ceil(time) - 1); };
$("scrub").oninput = function (e) { setPlaying(false); setTime(+e.target.value); };
$("speed").onchange = function (e) { speed = +e.target.value; };
$("center").onclick = center;
document.addEventListener("keydown", function (e) {
  if (!farm) return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  if (e.code === "ArrowRight") $("fwd").click();
  if (e.code === "ArrowLeft") $("back").click();
});

let dragging = false, px = 0, py = 0;
cv.addEventListener("mousedown", function (e) {
  dragging = true; px = e.clientX; py = e.clientY; cv.classList.add("drag");
});
window.addEventListener("mouseup", function () {
  dragging = false; cv.classList.remove("drag");
});
window.addEventListener("mousemove", function (e) {
  if (!dragging) return;
  cam.x += e.clientX - px; cam.y += e.clientY - py;
  px = e.clientX; py = e.clientY;
  draw();
});
cv.addEventListener("wheel", function (e) {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * 0.0015);
  cam.x = mx - (mx - cam.x) * f;
  cam.y = my - (my - cam.y) * f;
  cam.k *= f;
  draw();
}, { passive: false });

resize();
</script>
</body>
</html>
